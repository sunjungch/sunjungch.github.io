<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="NYC Trip">

<meta name="theme-color" content="#111111">

<style>
  :root{
    --ink:#111111;
    --border:#5C4A3A;
    --accent:#C9860F;
    --paper:#FFFFFF;
    --paper2:#FFFFFF;
    --red:#EE352E;
    --teal:#0039A6;
    --gold:#FFC72C;
    --green:#00933C;
    --purple:#B933AD;
    --orange:#FF6319;
    --line:#5C4A3A33;
    --mono: 'Pretendard', 'Helvetica Neue', Helvetica, Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --sans: 'Pretendard', 'Helvetica Neue', Helvetica, Arial, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background: var(--paper);
    font-family: var(--sans);
    color: var(--ink);
    min-height:100vh;
  }
  #app{max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:transparent; position:relative; z-index:1;}

  /* ---------- Entry screen ---------- */
  .entry-wrap{flex:1; display:flex; flex-direction:column; justify-content:center; padding:28px 24px 60px;}
  .entry-ticket{
    background: var(--paper2);
    border: 2px dashed var(--border);
    border-radius: 14px;
    padding: 28px 22px 22px;
    position:relative;
    box-shadow: 0 12px 0 0 var(--border);
  }
  .entry-ticket::before, .entry-ticket::after{
    content:"";
    position:absolute;
    width:16px; height:16px;
    background: var(--gold);
    border:2px solid var(--border);
    border-radius:50%;
    top: 50%; transform: translateY(-50%);
  }
  .entry-ticket::before{ left:-11px; }
  .entry-ticket::after{ right:-11px; }
  .marquee-stripe{
    display:flex; gap:5px; margin-bottom:16px;
  }
  .marquee-stripe span{
    height:6px; flex:1; border-radius:3px;
  }
  .marquee-stripe span:nth-child(1){background:var(--gold);}
  .marquee-stripe span:nth-child(2){background:var(--teal);}
  .marquee-stripe span:nth-child(3){background:var(--green);}
  .marquee-stripe span:nth-child(4){background:var(--red);}
  .brand-eyebrow{
    font-family: var(--mono);
    letter-spacing: 3px;
    font-size: 11px;
    color: var(--teal);
    text-transform: uppercase;
    margin-bottom: 6px;
    font-weight:700;
  }
  .brand-title{
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -1px;
    text-transform: uppercase;
    margin: 0 0 4px;
    line-height:1.05;
  }
  .brand-title em{
    font-style:normal;
    background: var(--gold);
    padding: 0 6px;
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
  }
  .brand-sub{
    font-size: 13px;
    color: #11111199;
    margin: 0 0 22px;
    font-family: var(--mono);
  }
  .field{margin-bottom:16px;}
  .field label{
    display:block;
    font-size: 11px;
    font-family: var(--mono);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--ink);
    opacity:0.6;
    margin-bottom:6px;
  }
  .field input{
    width:100%;
    border:none;
    border-bottom: 2px solid var(--border);
    background: transparent;
    font-size: 20px;
    font-family: var(--mono);
    padding: 8px 2px;
    color: var(--ink);
    letter-spacing: 1px;
  }
  .field input:focus{outline:none; border-bottom-color: var(--red);}
  .field input::placeholder{color:#11111155; letter-spacing:0.5px;}
  .go-btn{
    width:100%;
    margin-top:6px;
    padding:15px;
    border:2px solid var(--border);
    border-radius:999px;
    background: var(--gold);
    color: var(--ink);
    font-size:14.5px;
    font-weight:800;
    letter-spacing:1px;
    text-transform:uppercase;
    cursor:pointer;
    box-shadow: 0 4px 0 0 var(--border);
  }
  .go-btn:active{transform: translateY(4px); box-shadow:none;}
  .entry-hint{
    text-align:center;
    font-size:12px;
    color:#11111180;
    margin-top:18px;
    line-height:1.5;
  }
  .home-tip{
    margin-top:16px;
    background: #FFF3CF;
    color: var(--ink);
    border: 2px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    font-size:12px;
    line-height:1.6;
  }
  .home-tip b{color:var(--red);}

  /* ---------- Splash ---------- */
  .splash-wrap{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: linear-gradient(160deg, #FFE07A 0%, var(--gold) 100%);
    color: var(--ink); padding: 30px; text-align:center;
    cursor:pointer;
  }
  .splash-stripe{display:flex; gap:5px; width:180px; margin-bottom:24px;}
  .splash-stripe span{height:6px; flex:1; border-radius:3px; background:var(--ink); opacity:0.85;}
  .splash-stripe span:nth-child(2){background:var(--teal);}
  .splash-stripe span:nth-child(3){background:var(--green);}
  .splash-stripe span:nth-child(4){background:var(--red);}
  .splash-emoji{font-size:44px; margin-bottom:10px;}
  .splash-code{
    font-family:var(--mono); letter-spacing:3px; font-size:12px; color:var(--ink); opacity:0.65;
    text-transform:uppercase; margin-bottom:8px; font-weight:700;
  }
  .splash-title{font-size:26px; font-weight:800; margin-bottom:6px;}
  .splash-sub{font-size:13px; opacity:0.6; font-family:var(--mono);}
  .splash-dots{margin-top:26px; display:flex; gap:8px;}
  .splash-dots span{
    width:8px; height:8px; border-radius:50%; background:var(--ink);
    animation: dotPulse 1.2s ease-in-out infinite;
  }
  .splash-dots span:nth-child(2){animation-delay:0.15s;}
  .splash-dots span:nth-child(3){animation-delay:0.3s;}
  @keyframes dotPulse{
    0%, 80%, 100%{ opacity:0.25; transform:scale(0.85); }
    40%{ opacity:1; transform:scale(1.1); }
  }
  .splash-skip{margin-top:22px; font-size:11px; opacity:0.55; font-family:var(--mono); letter-spacing:1px;}

  /* ---------- Header ---------- */
  .topbar{
    position:sticky; top:0; z-index:10;
    background: #FFF3CF;
    color: var(--ink);
    padding: 14px 18px 12px;
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:3px solid var(--border);
  }
  .topbar-code{
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing:2px;
    opacity:0.6;
    text-transform:uppercase;
  }
  .topbar-title{font-size:18px; font-weight:800; margin-top:2px;}
  .exit-btn{
    background:var(--paper2); border:2px solid var(--border); color:var(--ink);
    border-radius:999px; padding:6px 12px; font-size:11px; font-family:var(--mono); font-weight:700;
    letter-spacing:1px; cursor:pointer;
  }

  /* ---------- Tabs ---------- */
  .tabbar{
    display:flex;
    background: var(--paper2);
    border-bottom: 3px solid var(--border);
    position:sticky; top:60px; z-index:9;
  }
  .tab{
    flex:1; text-align:center; padding:11px 2px;
    font-size:11.5px; font-weight:700; color:#11111170;
    cursor:pointer; position:relative;
    font-family: var(--sans);
    text-transform:uppercase;
    letter-spacing:0.2px;
  }
  .tab.active{color:var(--ink);}
  .tab.active::after{
    content:""; position:absolute; left:16%; right:16%; bottom:-3px; height:4px;
    border-radius:2px; background:var(--gold);
  }

  .content{flex:1; padding:16px 16px 100px;}

  /* ---------- Home Dashboard ---------- */
  .home-greet{margin-bottom:18px;}
  .home-greet-eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:2px; text-transform:uppercase;
    color: var(--orange); margin-bottom:4px; font-weight:700;
  }
  .home-greet-title{font-size:19px; font-weight:800; line-height:1.35;}
  .dday-card{
    background: #FFF3CF; border:2px solid var(--border); border-radius:14px;
    padding:20px; text-align:center; margin-bottom:16px;
  }
  .dday-label{font-family:var(--mono); font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#11111170; margin-bottom:6px;}
  .dday-value{font-size:28px; font-weight:800; font-family:var(--mono); color:var(--accent); line-height:1.1;}
  .dday-sub{font-size:12px; color:#11111180; margin-top:6px;}
  .home-card{
    background: var(--paper2); border:2px solid var(--border); border-radius:12px;
    padding:14px 16px; margin-bottom:14px;
  }
  .home-card-title{
    font-size:13px; font-weight:800; margin-bottom:10px;
    text-transform:uppercase; letter-spacing:0.3px;
  }
  .home-empty{font-size:12.5px; color:#11111170; padding:6px 0; line-height:1.5;}
  .home-mini-row{
    display:flex; align-items:center; gap:10px; padding:7px 0;
    border-bottom:1px dashed var(--line); font-size:13.5px;
  }
  .home-mini-row:last-child{border-bottom:none;}
  .home-mini-time{font-family:var(--mono); font-size:11.5px; color:var(--red); font-weight:700; flex-shrink:0; min-width:52px;}
  .home-mini-time.free{color:#11111160; font-weight:600; font-size:11px;}
  .home-mini-text{flex:1; font-weight:600;}
  .home-mini-badge{
    width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:11px; color:#fff; flex-shrink:0;
  }
  .home-mini-badge.flight{background:var(--accent);}
  .home-mini-badge.lodging{background:var(--green);}
  .weather-main{font-size:26px; font-weight:800; font-family:var(--mono);}
  .weather-sub{font-size:12px; color:#11111180; margin-top:2px;}
  .weather-denied{font-size:12.5px; color:#11111180; margin-bottom:8px;}
  .weather-retry{
    background:var(--accent); color:#fff; border:none; border-radius:999px;
    padding:7px 14px; font-size:11.5px; font-weight:700; cursor:pointer;
  }

  /* ---------- Day / Itinerary ---------- */
  .day-block{margin-bottom:20px;}
  .day-head{
    display:flex; align-items:center; gap:10px;
    margin-bottom:12px; padding:8px 12px;
    background: var(--paper2); border:2px solid var(--border); border-left:6px solid var(--gold);
    border-radius:6px;
  }
  .day-name{font-size:14px; font-weight:800; color:var(--ink); text-transform:uppercase; letter-spacing:0.5px;}
  .day-date{font-family:var(--mono); font-size:11px; color:var(--accent); font-weight:700; margin-left:auto;}
  .day-del{
    background:none; border:none; color:#11111150; font-size:14px; cursor:pointer;
    padding:0 0 0 10px;
  }
  .stub{
    background: var(--paper2);
    border:2px solid var(--border);
    border-radius:10px;
    padding: 12px 14px;
    margin-bottom:10px;
    position:relative;
    display:flex; gap:12px;
  }
  .stub .time{
    font-family:var(--mono); font-weight:700; font-size:13px;
    min-width:52px; color:var(--red);
    border-right:2px dashed var(--border); padding-right:12px;
  }
  .stub .body{flex:1; min-width:0;}
  .stub .place-row{display:flex; align-items:center; gap:6px; margin-bottom:2px;}
  .stub .place{font-weight:700; font-size:14.5px;}
  .stub .memo{font-size:12.5px; color:#11111199; word-break:break-word;}
  .stub .by{font-family:var(--mono); font-size:10px; color:var(--accent); margin-top:6px; letter-spacing:0.5px;}
  .stub .actions{display:flex; flex-direction:column; align-items:center; gap:6px;}
  .stub .del{
    background:none; border:none; color:#11111155; font-size:16px; cursor:pointer; padding:0 2px;
  }
  .stub .order-btns{display:flex; flex-direction:column; gap:2px;}
  .order-btn{
    background:none; border:none; color:#111111aa; font-size:13px; cursor:pointer;
    padding:1px 3px; line-height:1;
  }
  .order-btn:disabled{color:#11111125; cursor:default;}
  .time-badge{
    display:inline-flex; align-items:center; font-family:var(--mono); font-weight:700; font-size:11.5px;
    color:var(--red); background:#EE352E14; border-radius:6px; padding:2px 7px; margin-bottom:4px;
  }
  .map-btn{
    background: #FFF3CF; color:var(--accent); border:none; border-radius:999px;
    padding:4px 10px; font-size:10.5px; font-weight:700; letter-spacing:0.3px; cursor:pointer; flex-shrink:0;
    display:inline-flex; align-items:center; justify-content:center; white-space:nowrap;
  }
  .resv-actions{display:flex; gap:8px; align-items:center;}
  .add-row{
    display:flex; align-items:center; justify-content:center; gap:6px;
    border: 2px dashed var(--border);
    border-radius:10px;
    padding:12px;
    color: var(--ink);
    font-weight:700; font-size:13.5px;
    cursor:pointer;
    background: transparent;
    width:100%;
  }
  .add-day-btn{
    width:100%; margin-top:4px;
    background: transparent; border: none;
    color: var(--accent); font-weight:700; font-size:13px;
    padding:10px; cursor:pointer; font-family: var(--mono); letter-spacing:1px;
  }

  /* ---------- Reservations ---------- */
  .resv-card{
    background: var(--paper2);
    border:2px solid var(--border);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:12px;
    position:relative;
    overflow:hidden;
  }
  .resv-card.flight{border-left:6px solid var(--accent);}
  .resv-card.lodging{border-left:6px solid var(--green);}
  .resv-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .resv-eyebrow{
    font-family:var(--mono); font-size:10.5px; letter-spacing:2px; text-transform:uppercase;
    margin-bottom:4px;
  }
  .resv-card.flight .resv-eyebrow{color:var(--accent);}
  .resv-card.lodging .resv-eyebrow{color:var(--green);}
  .resv-title{font-size:15.5px; font-weight:800;}
  .resv-title-row{display:flex; align-items:center; gap:8px;}
  .resv-icon{font-size:20px; flex-shrink:0;}
  .resv-provider{font-size:12.5px; color:#11111190; margin-top:2px;}
  .resv-del{background:none; border:none; color:#11111155; font-size:15px; cursor:pointer;}
  .resv-route{
    display:flex; align-items:center; gap:8px; margin-top:10px;
    font-family:var(--mono); font-size:13px; font-weight:700;
  }
  .resv-route .dash{flex:1; border-top:2px dashed var(--border); position:relative; top:-4px;}
  .resv-route .plane{font-size:13px;}
  .resv-times{display:flex; justify-content:space-between; margin-top:4px; font-size:11px; color:#11111180; font-family:var(--mono);}
  .resv-stay{display:flex; justify-content:space-between; margin-top:10px; font-family:var(--mono); font-size:12.5px;}
  .resv-stay .lbl{display:block; font-size:9.5px; letter-spacing:1px; color:#11111170; text-transform:uppercase; margin-bottom:2px;}
  .resv-confirm{
    margin-top:10px; padding-top:8px; border-top:1px dashed var(--line);
    font-family:var(--mono); font-size:11px; color:#11111190; display:flex; justify-content:space-between;
  }
  .resv-memo{font-size:12px; color:#11111190; margin-top:6px;}
  .type-toggle{display:flex; gap:8px; margin-bottom:16px;}
  .type-btn{
    flex:1; text-align:center; padding:10px; border-radius:10px; border:2px solid var(--border);
    font-weight:700; font-size:13.5px; cursor:pointer;
  }
  .type-btn.on{background:var(--accent); color:#fff;}

  /* ---------- Settlement ---------- */
  .expense-card{
    background: var(--paper2);
    border:2px solid var(--border);
    border-radius:10px;
    padding:12px 14px;
    margin-bottom:10px;
  }
  .expense-top{display:flex; justify-content:space-between; align-items:flex-start;}
  .expense-desc{font-weight:700; font-size:14.5px;}
  .expense-amt{font-family:var(--mono); font-weight:800; font-size:15px; color:var(--accent);}
  .expense-meta{font-size:11.5px; color:#11111190; margin-top:4px; font-family:var(--mono);}
  .expense-split{font-size:11.5px; color:#11111180; margin-top:4px;}
  .expense-del{
    background:none;border:none;color:#11111155;font-size:15px;cursor:pointer;
  }
  .balance-panel{
    background: var(--paper2); color: var(--ink); border:2px solid var(--border);
    border-radius:12px; padding:16px; margin-bottom:16px;
  }
  .balance-title{font-family:var(--mono); font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#11111170; margin-bottom:10px;}
  .balance-row{display:flex; justify-content:space-between; padding:6px 0; font-size:14px; border-bottom:1px dashed var(--line);}
  .balance-row:last-child{border-bottom:none;}
  .balance-plus{color:var(--accent); font-family:var(--mono); font-weight:700;}
  .balance-minus{color:var(--accent); font-family:var(--mono); font-weight:700;}
  .balance-zero{color:var(--accent); font-family:var(--mono); font-weight:700; opacity:0.6;}
  .settle-title{font-family:var(--mono); font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#11111180; margin: 18px 0 10px;}
  .settle-row{
    display:flex; align-items:center; gap:8px; font-size:14px; padding:8px 0;
    border-bottom:1px dashed var(--line);
  }
  .settle-arrow{color:var(--accent); font-weight:800;}
  .settle-amt{margin-left:auto; font-family:var(--mono); font-weight:800;}

  /* ---------- Segmented toggle (settle/checklist sub-views) ---------- */
  .segmented{
    display:flex; gap:6px; margin-bottom:16px;
    background: var(--paper2); border:2px solid var(--border); border-radius:999px; padding:4px;
  }
  .segment-btn{
    flex:1; text-align:center; padding:8px 6px; border-radius:999px;
    font-size:12.5px; font-weight:700; cursor:pointer; color:#11111180;
  }
  .segment-btn.active{background:var(--accent); color:#fff;}

  /* ---------- Date-grouped expenses ---------- */
  .day-expense-group{margin-bottom:16px;}
  .day-expense-head{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:6px 2px 8px; border-bottom:2px solid var(--border); margin-bottom:8px;
  }
  .day-expense-head span:first-child{font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.3px;}
  .day-expense-total{font-family:var(--mono); font-weight:800; font-size:13px; color:var(--accent);}

  /* ---------- Personal Expenses ---------- */
  .personal-total{
    background: #FFF3CF; color: var(--ink); border:2px solid var(--border); border-radius:12px;
    padding:16px; margin-bottom:16px; text-align:center;
  }
  .personal-total-label{font-family:var(--mono); font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#11111170; margin-bottom:6px;}
  .personal-total-amt{font-size:24px; font-weight:800; font-family:var(--mono); color:var(--accent);}
  .personal-item{
    background: var(--paper2); border:2px solid var(--border); border-radius:10px;
    padding:12px 14px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .personal-item-desc{font-weight:700; font-size:14px;}
  .personal-item-date{font-family:var(--mono); font-size:11px; color:#11111180; margin-top:2px;}
  .personal-item-amt{font-family:var(--mono); font-weight:800; font-size:14.5px; color:var(--accent); white-space:nowrap;}

  /* ---------- Checklist ---------- */
  .check-progress{
    background: #FFF3CF; color: var(--ink); border:2px solid var(--border); border-radius:12px;
    padding:14px 16px; margin-bottom:16px;
  }
  .check-progress-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;}
  .check-progress-label{font-family:var(--mono); font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#11111170;}
  .check-progress-count{font-family:var(--mono); font-weight:800; font-size:14px; color:var(--accent);}
  .check-progress-bar{height:8px; background:#11111120; border-radius:4px; overflow:hidden;}
  .check-progress-fill{height:100%; background:var(--accent); border-radius:4px; transition: width 0.25s ease;}
  .check-item{
    display:flex; align-items:center; gap:12px;
    background: var(--paper2); border:2px solid var(--border); border-radius:10px;
    padding:12px 14px; margin-bottom:8px; cursor:pointer;
  }
  .check-circle{
    width:24px; height:24px; border-radius:50%; border:2px solid var(--border);
    flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:800; color:transparent;
  }
  .check-item.checked .check-circle{background:var(--accent); border-color:var(--accent); color:#fff;}
  .check-text{flex:1; font-size:14px; font-weight:600;}
  .check-item.checked .check-text{color:#11111160; text-decoration:line-through;}
  .check-del{background:none; border:none; color:#11111145; font-size:15px; cursor:pointer;}
  .check-others{
    font-family:var(--mono); font-size:10.5px; color:var(--accent); flex-shrink:0;
  }

  /* ---------- Memos ---------- */
  .memo-card{
    background: var(--paper2); border:2px solid var(--border); border-radius:10px;
    padding:14px 16px; margin-bottom:10px;
  }
  .memo-private-badge{
    display:inline-block; font-family:var(--mono); font-size:10px; font-weight:700;
    color:var(--accent); background:#FFF3CF; border-radius:6px; padding:2px 8px; margin-bottom:8px;
  }
  .memo-text{font-size:14.5px; line-height:1.6; white-space:pre-wrap; word-break:break-word;}
  .memo-meta{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:8px; padding-top:8px; border-top:1px dashed var(--line);
    font-family:var(--mono); font-size:11px; color:#11111170;
  }
  .memo-del{background:none; border:none; color:#11111150; font-size:11px; font-weight:700; cursor:pointer; font-family:var(--sans);}

  /* ---------- Members ---------- */
  .member-chip{
    display:inline-flex; align-items:center; gap:6px;
    background: var(--paper2); border:2px solid var(--border); border-radius:999px;
    padding:6px 12px; margin:0 6px 6px 0; font-size:13px; font-weight:700;
  }
  .empty{
    text-align:center; color:#11111170; font-size:13px; padding:30px 10px; line-height:1.6;
  }

  /* ---------- FAB ---------- */
  .fab{
    position:fixed; left:50%; bottom:22px; transform:translateX(calc(-50% + 0px));
    max-width:480px; width:calc(100% - 32px);
    display:flex; justify-content:flex-end;
    pointer-events:none;
  }
  .fab button{
    pointer-events:auto;
    background: var(--gold); color:var(--ink); border:3px solid var(--border);
    width:58px; height:58px; border-radius:50%;
    font-size:26px; font-weight:800; cursor:pointer;
    box-shadow: 0 4px 0 0 var(--border);
  }
  .fab button:active{ transform: translateY(4px); box-shadow:none; }

  /* ---------- Modal ---------- */
  .modal-bg{
    position:fixed; inset:0; background: rgba(17,17,17,0.6);
    display:flex; align-items:flex-end; justify-content:center; z-index:50;
  }
  .modal{
    background: var(--paper); width:100%; max-width:480px;
    border-radius: 18px 18px 0 0;
    padding: 20px 20px 28px;
    max-height:88vh; overflow-y:auto;
    border-top:4px solid var(--gold);
  }
  .modal-title{font-size:17px; font-weight:800; margin-bottom:16px;}
  .modal .field input, .modal .field select{
    width:100%; border:none; border-bottom:2px solid var(--border); background:transparent;
    font-size:16px; padding:8px 2px; font-family: var(--sans); color:var(--ink);
  }
  .modal .field input:focus, .modal .field select:focus{outline:none; border-bottom-color:var(--red);}
  .check-list{display:flex; flex-wrap:wrap; gap:8px; margin-top:4px;}
  .check-chip{
    padding:8px 12px; border-radius:999px; border:2px solid var(--border);
    font-size:13px; font-weight:700; cursor:pointer; user-select:none;
  }
  .check-chip.on{background:var(--accent); color:#fff;}
  .modal-actions{display:flex; gap:10px; margin-top:20px;}
  .modal-actions button{
    flex:1; padding:13px; border-radius:999px; border:none; font-weight:700; font-size:14px; cursor:pointer;
  }
  .btn-cancel{background:transparent; border:2px solid var(--border) !important; color:var(--ink);}
  .btn-confirm{background:var(--accent); color:#fff;}

  .sync-note{
    text-align:center; font-family:var(--mono); font-size:10px; color:#11111160;
    padding: 6px 0 2px; letter-spacing:0.5px;
  }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
  /* =========================================================
     🔥 Firebase 설정 (직접 호스팅 시 필수)
     1) https://console.firebase.google.com 에서 새 프로젝트 생성
     2) 왼쪽 메뉴 "Firestore Database" → 데이터베이스 만들기 (테스트 모드로 시작)
     3) 프로젝트 설정(⚙️) → 일반 → "웹 앱 추가" → 아래 firebaseConfig 값 붙여넣기
     4) Firestore 규칙(테스트 모드는 기간 제한이 있으니 아래 규칙으로 교체 권장):
        rules_version = '2';
        service cloud.firestore {
          match /databases/{database}/documents {
            match /trips/{code} {
              allow read, write: if true;
            }
          }
        }
        ⚠️ 이 규칙은 완전히 열려있는 규칙이에요(로그인 없이 코드만 알면 접근 가능).
        지금 앱의 "여행 코드" 방식과 동일한 보안 수준이니, 추측하기 어려운 코드를 쓰세요.
     ========================================================= */
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, doc, getDoc, setDoc, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBs0A6g6ifinbxyDLYKLgLL7fdvcS4P1Ho",
    authDomain: "newyork-cfbc3.firebaseapp.com",
    projectId: "newyork-cfbc3",
    storageBucket: "newyork-cfbc3.firebasestorage.app",
    messagingSenderId: "973962731930",
    appId: "1:973962731930:web:e5c928ab38d6aa8f9f9a23"
  };


  if(firebaseConfig.apiKey === "YOUR_API_KEY"){
    window.__fbConfigMissing = true;
  } else {
    try{
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);
      window.__fb = { db, doc, getDoc, setDoc, onSnapshot };
      window.__fbReady = true;
    }catch(e){
      console.error('Firebase init failed', e);
      window.__fbConfigMissing = true;
    }
  }
  window.dispatchEvent(new Event('firebase-ready'));
</script>
<script>
(function(){
  const app = document.getElementById('app');

  // ---------------- state ----------------
  let state = {
    screen: 'entry', // entry | splash | main
    code: '',
    name: '',
    tab: 'home', // home | itinerary | resv | settle | checklist | members
    settleView: 'group', // group | personal
    checklistView: 'outbound', // outbound | return
    data: null, // { participants, days, expenses, updatedAt }
    modal: null, // {type:'item'|'expense'|'day', dayId}
  };

  let unsubscribeTrip = null;
  let saving = false;

  function esc(s){
    return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  function defaultChecklistItems(kind){
    const outbound = [
      '여권 (유효기간 6개월 이상 확인)',
      'ESTA 승인 확인 및 출력본',
      '왕복 항공권 예약 확인서',
      '해외여행자보험 가입',
      '해외결제 가능한 신용카드',
      '소액 달러 현금',
      '멀티 어댑터 (110V / Type A,B 콘센트)',
      '보조배터리 (기내 휴대만 가능)',
      '유심 또는 이심 / 포켓와이파이',
      '편한 운동화 (지하철·도보 이동 많음)',
      '우산 또는 방수 재킷 (변덕스런 날씨)',
      '상비약 (진통제, 소화제 등)',
      '숙소·항공권 예약 확인증 캡처본'
    ];
    const returnTrip = [
      '여권 재확인',
      '귀국 항공권/탑승권 확인',
      '기념품 캐리어에 안전하게 포장',
      '액체류 반입 제한 확인 (100ml 이하 지퍼백)',
      '충전기·케이블 두고 오지 않기',
      '호텔 방 분실물 확인',
      '캐리어 무게 확인 (수하물 제한)',
      '남은 현금·카드 정리',
      '여행자보험 증빙서류 보관',
      '유심/이심 정리 또는 복구'
    ];
    const list = kind === 'return' ? returnTrip : outbound;
    return list.map(text => ({ id: uid(), text, checkedBy: [] }));
  }

  function emptyTripData(){
    return {
      participants: [],
      days: [{ id: uid(), label: '1일차', date: '', items: [] }],
      expenses: [],
      reservations: [],
      checklist: {
        outbound: defaultChecklistItems('outbound'),
        return: defaultChecklistItems('return')
      },
      personalExpenses: {},
      memos: [],
      updatedAt: Date.now()
    };
  }

  function normalizeChecklistItem(it){
    if(!it.checkedBy){ it.checkedBy = it.checked ? [it.by || '?'] : []; }
    delete it.checked;
    delete it.by;
    return it;
  }

  function withDefaults(data){
    if(!data.reservations) data.reservations = [];
    if(!data.expenses) data.expenses = [];
    if(!data.days) data.days = [];
    if(!data.personalExpenses) data.personalExpenses = {};
    if(!data.memos) data.memos = [];

    if(!data.checklist){
      data.checklist = {
        outbound: defaultChecklistItems('outbound'),
        return: defaultChecklistItems('return')
      };
    } else if(Array.isArray(data.checklist)){
      // migrate legacy single-list format -> outbound list
      data.checklist = {
        outbound: data.checklist.map(normalizeChecklistItem),
        return: defaultChecklistItems('return')
      };
    } else {
      if(!data.checklist.outbound) data.checklist.outbound = defaultChecklistItems('outbound');
      if(!data.checklist.return) data.checklist.return = defaultChecklistItems('return');
      data.checklist.outbound = data.checklist.outbound.map(normalizeChecklistItem);
      data.checklist.return = data.checklist.return.map(normalizeChecklistItem);
    }
    return data;
  }

  async function loadTrip(code){
    try{
      const { db, doc, getDoc } = window.__fb;
      const snap = await getDoc(doc(db, 'trips', code));
      if(snap.exists()){
        return withDefaults(snap.data());
      }
      return null;
    }catch(e){
      console.error('loadTrip error', e);
      return null;
    }
  }

  async function saveTrip(code, data){
    saving = true;
    data.updatedAt = Date.now();
    try{
      const { db, doc, setDoc } = window.__fb;
      await setDoc(doc(db, 'trips', code), data);
    }catch(e){
      console.error('save failed', e);
    }
    saving = false;
  }

  function startPolling(){
    if(unsubscribeTrip) unsubscribeTrip();
    const { db, doc, onSnapshot } = window.__fb;
    unsubscribeTrip = onSnapshot(doc(db, 'trips', state.code), (snap)=>{
      if(state.screen !== 'main' || saving || state.modal) return;
      if(snap.exists()){
        state.data = withDefaults(snap.data());
        render();
      }
    }, (err)=>{
      console.error('realtime sync error', err);
    });
  }

  async function persistAndRender(){
    render();
    await saveTrip(state.code, state.data);
  }

  function loadLastSession(){
    try{
      const raw = localStorage.getItem('nycTripLastSession');
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }

  function saveLastSession(code, name){
    try{
      localStorage.setItem('nycTripLastSession', JSON.stringify({code, name}));
    }catch(e){ /* ignore */ }
  }

  function clearLastSession(){
    try{ localStorage.removeItem('nycTripLastSession'); }catch(e){ /* ignore */ }
  }

  // ---------------- entry screen ----------------
  function renderEntry(){
    const prefillCode = state.code || '';
    const prefillName = state.name || '';
    app.innerHTML = `
      <div class="entry-wrap">
        <div class="entry-ticket">
          <div class="marquee-stripe"><span></span><span></span><span></span><span></span></div>
          <div class="brand-eyebrow">MTA · Trip Line · All Boroughs</div>
          <h1 class="brand-title">New York<br/><em>City Trip</em></h1>
          <p class="brand-sub">NEXT STOP: 여행 코드 입력</p>
          <p class="brand-sub" style="margin-top:-16px; font-family:var(--sans); font-size:13.5px; opacity:0.75;">여행 코드만 맞으면 다 같이 보고 고칠 수 있어요.</p>
          <div class="field">
            <label>여행 코드</label>
            <input id="in-code" type="text" placeholder="예: NYC2026" autocomplete="off" value="${prefillCode}" />
          </div>
          <div class="field">
            <label>내 이름</label>
            <input id="in-name" type="text" placeholder="예: 선정" autocomplete="off" value="${prefillName}" />
          </div>
          <button class="go-btn" id="enter-btn">입장하기 →</button>
          <div class="entry-hint">코드가 없으면 새로 만들어져요.<br/>친구들에게 이 코드와 이 URL을 그대로 공유하세요.<br/>다음에 열 때는 자동으로 들어와져요.<br/>🗽 SEE YOU IN NYC</div>
          <div class="home-tip">📲 <b>홈 화면에 추가</b>하면 앱처럼 아이콘으로 바로 열 수 있어요.<br/>아이폰: 공유 버튼 → "홈 화면에 추가"<br/>안드로이드: ⋮ 메뉴 → "홈 화면에 추가"</div>
        </div>
      </div>
    `;
    document.getElementById('enter-btn').onclick = onEnter;
    document.getElementById('in-name').addEventListener('keydown', e=>{ if(e.key==='Enter') onEnter(); });
  }

  async function onEnter(){
    const codeRaw = document.getElementById('in-code').value.trim();
    const nameRaw = document.getElementById('in-name').value.trim();
    if(!codeRaw || !nameRaw){ return; }
    const code = codeRaw.toUpperCase().replace(/\s+/g,'');
    state.code = code;
    state.name = nameRaw;

    let data = await loadTrip(code);
    if(!data){ data = emptyTripData(); }
    if(!data.participants.includes(nameRaw)){ data.participants.push(nameRaw); }
    state.data = data;
    await saveTrip(code, data);
    await saveLastSession(code, nameRaw);
    startPolling();
    showSplashThenMain();
  }

  function renderSplash(){
    app.innerHTML = `
      <div class="splash-wrap" id="splash-skip">
        <div class="splash-stripe"><span></span><span></span><span></span><span></span></div>
        <div class="splash-emoji">🚕</div>
        <div class="splash-code">TRIP #${esc(state.code)}</div>
        <div class="splash-title">${esc(state.name)}님 어서오세요</div>
        <div class="splash-sub">NEW YORK CITY TRIP</div>
        <div class="splash-dots"><span></span><span></span><span></span></div>
        <div class="splash-skip">👆 탭해서 시작하기</div>
      </div>
    `;
    document.getElementById('splash-skip').onclick = ()=>{
      state.screen = 'main';
      render();
    };
  }

  function showSplashThenMain(){
    state.screen = 'splash';
    state.tab = 'home';
    render();
  }

  // ---------------- main screen ----------------
  function render(){
    if(state.screen === 'entry'){ renderEntry(); return; }
    if(state.screen === 'splash'){ renderSplash(); return; }
    const d = state.data;

    let tabContent = '';
    if(state.tab === 'home') tabContent = renderHome(d);
    else if(state.tab === 'itinerary') tabContent = renderItinerary(d);
    else if(state.tab === 'resv') tabContent = renderReservations(d);
    else if(state.tab === 'settle') tabContent = renderSettle(d);
    else if(state.tab === 'checklist') tabContent = renderChecklist(d);
    else if(state.tab === 'memo') tabContent = renderMemos(d);
    else tabContent = renderMembers(d);

    const dday = computeDday(d);
    let headerTitle = '🚕 뉴욕여행';
    if(dday.status === 'before') headerTitle = `🚕 뉴욕여행 D-${dday.diff}`;
    else if(dday.status === 'during') headerTitle = `🚕 뉴욕여행 ${dday.dayNum}일차`;
    else if(dday.status === 'after') headerTitle = `🚕 뉴욕여행 완료`;

    app.innerHTML = `
      <div class="topbar">
        <div>
          <div class="topbar-code">TRIP #${esc(state.code)}</div>
          <div class="topbar-title">${headerTitle}</div>
        </div>
        <button class="exit-btn" id="exit-btn">코드 변경</button>
      </div>
      <div class="tabbar">
        <div class="tab ${state.tab==='home'?'active':''}" data-tab="home">홈</div>
        <div class="tab ${state.tab==='itinerary'?'active':''}" data-tab="itinerary">일정</div>
        <div class="tab ${state.tab==='resv'?'active':''}" data-tab="resv">예약</div>
        <div class="tab ${state.tab==='settle'?'active':''}" data-tab="settle">정산</div>
        <div class="tab ${state.tab==='checklist'?'active':''}" data-tab="checklist">준비물</div>
        <div class="tab ${state.tab==='memo'?'active':''}" data-tab="memo">메모</div>
        <div class="tab ${state.tab==='members'?'active':''}" data-tab="members">멤버</div>
      </div>
      <div class="content">
        ${tabContent}
        <div class="sync-note">${saving? '동기화 중…' : '실시간 동기화 중'}</div>
      </div>
      ${(state.tab!=='members' && state.tab!=='home') ? `<div class="fab"><button id="fab-btn">+</button></div>` : ''}
    `;

    document.getElementById('exit-btn').onclick = ()=>{
      if(unsubscribeTrip){ unsubscribeTrip(); unsubscribeTrip = null; }
      state.screen='entry'; state.data=null; state.modal=null;
      render();
    };
    document.querySelectorAll('.tab').forEach(t=>{
      t.onclick = ()=>{ state.tab = t.dataset.tab; render(); };
    });
    const fab = document.getElementById('fab-btn');
    if(fab){
      fab.onclick = ()=>{
        if(state.tab==='itinerary'){
          if(!d.days.length){
            const newDay = { id: uid(), label: '1일차', date: '', items: [] };
            state.data.days.push(newDay);
            openItemModal(newDay.id);
          } else {
            openItemModal(d.days[0].id);
          }
        }
        else if(state.tab==='resv') openReservationModal();
        else if(state.tab==='checklist') openChecklistModal();
        else if(state.tab==='memo') openMemoModal();
        else if(state.tab==='settle') {
          if(state.settleView==='personal') openPersonalExpenseModal();
          else openExpenseModal();
        }
      };
    }
    attachDynamicHandlers();
    if(state.modal) renderModal();
    if(state.tab === 'home') refreshWeather();
  }

  function weatherCodeInfo(code){
    const map = {
      0:{emoji:'☀️',label:'맑음'}, 1:{emoji:'🌤',label:'대체로 맑음'}, 2:{emoji:'⛅',label:'부분적으로 흐림'},
      3:{emoji:'☁️',label:'흐림'}, 45:{emoji:'🌫',label:'안개'}, 48:{emoji:'🌫',label:'짙은 안개'},
      51:{emoji:'🌦',label:'약한 이슬비'}, 53:{emoji:'🌦',label:'이슬비'}, 55:{emoji:'🌧',label:'강한 이슬비'},
      61:{emoji:'🌧',label:'약한 비'}, 63:{emoji:'🌧',label:'비'}, 65:{emoji:'🌧',label:'강한 비'},
      71:{emoji:'🌨',label:'약한 눈'}, 73:{emoji:'🌨',label:'눈'}, 75:{emoji:'❄️',label:'강한 눈'},
      80:{emoji:'🌦',label:'소나기'}, 81:{emoji:'🌧',label:'강한 소나기'}, 82:{emoji:'⛈',label:'매우 강한 소나기'},
      95:{emoji:'⛈',label:'뇌우'}, 96:{emoji:'⛈',label:'우박 동반 뇌우'}, 99:{emoji:'⛈',label:'강한 우박 동반 뇌우'}
    };
    return map[code] || {emoji:'🌡', label:'날씨 정보'};
  }

  function refreshWeather(){
    const el = document.getElementById('weather-body');
    if(!el) return;
    if(!navigator.geolocation){ el.innerHTML = '이 브라우저에서는 위치 확인이 어려워요.'; return; }
    el.innerHTML = '위치 확인 중…';
    navigator.geolocation.getCurrentPosition(async (pos)=>{
      const targetEl = document.getElementById('weather-body');
      const titleEl = document.getElementById('weather-title');
      try{
        const { latitude, longitude } = pos.coords;
        const [weatherRes, geoRes] = await Promise.allSettled([
          fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true`).then(r=>r.json()),
          fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${latitude}&longitude=${longitude}&localityLanguage=ko`).then(r=>r.json())
        ]);

        if(geoRes.status === 'fulfilled' && titleEl){
          const g = geoRes.value;
          const place = g.city || g.locality || g.principalSubdivision || '';
          titleEl.textContent = place ? `🌤 ${place} 현재 날씨` : '🌤 현재 날씨';
        }

        if(!targetEl) return;
        if(weatherRes.status !== 'fulfilled' || !weatherRes.value.current_weather){
          targetEl.innerHTML = '날씨 정보를 가져오지 못했어요.';
          return;
        }
        const cw = weatherRes.value.current_weather;
        const info = weatherCodeInfo(cw.weathercode);
        targetEl.innerHTML = `
          <div class="weather-main">${info.emoji} ${Math.round(cw.temperature)}°C</div>
          <div class="weather-sub">${info.label} · 바람 ${Math.round(cw.windspeed)}km/h</div>
        `;
      }catch(e){
        if(targetEl) targetEl.innerHTML = '날씨를 불러오지 못했어요.';
      }
    }, ()=>{
      const targetEl = document.getElementById('weather-body');
      if(!targetEl) return;
      targetEl.innerHTML = `
        <div class="weather-denied">위치 권한을 허용하면 현재 날씨를 볼 수 있어요.</div>
        <button class="weather-retry" id="weather-retry-btn">다시 시도</button>
      `;
      const btn = document.getElementById('weather-retry-btn');
      if(btn) btn.onclick = refreshWeather;
    }, { timeout: 8000 });
  }

  function renderHome(d){
    const now = new Date();
    const todayStr = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
    const todayDay = (d.days||[]).find(x => x.date === todayStr);
    const todayItems = todayDay ? todayDay.items : [];

    const tomorrow = new Date(now);
    tomorrow.setDate(now.getDate() + 1);
    const tomorrowStr = tomorrow.getFullYear() + '-' + String(tomorrow.getMonth()+1).padStart(2,'0') + '-' + String(tomorrow.getDate()).padStart(2,'0');
    const tomorrowDay = (d.days||[]).find(x => x.date === tomorrowStr);
    const tomorrowItems = tomorrowDay ? tomorrowDay.items : [];

    const parsed = (d.reservations||[]).map(r=>({ r, t: r.start ? new Date(r.start) : null }));
    let upcoming = parsed.filter(x=>x.t && !isNaN(x.t.getTime()) && x.t >= now).sort((a,b)=>a.t-b.t).map(x=>x.r).slice(0,3);
    if(!upcoming.length) upcoming = (d.reservations||[]).slice(0,3);

    const dateLabel = now.toLocaleDateString('ko-KR', { month:'long', day:'numeric', weekday:'short' });
    const dday = computeDday(d);

    let ddayBlock = '';
    if(dday.status === 'unset'){
      ddayBlock = `
        <div class="dday-card">
          <div class="dday-label">D-DAY</div>
          <div class="dday-value" style="font-size:16px;">일정에서 날짜를 설정해보세요</div>
          <div class="dday-sub">일정 탭에서 날짜 배지를 누르면 D-day가 계산돼요</div>
        </div>`;
    }

    let greetingTitle;
    if(dday.status === 'during'){
      greetingTitle = `여행 ${dday.dayNum}일차, ${esc(state.name)}님 오늘도 즐거운 뉴욕 여행 되세요 🗽`;
    } else if(dday.status === 'before'){
      greetingTitle = `출발까지 D-${dday.diff}, ${esc(state.name)}님 뉴욕 여행 준비 잘 되고 있나요? 🗽`;
    } else if(dday.status === 'after'){
      greetingTitle = `여행 완료 (D+${dday.diff}), ${esc(state.name)}님 즐거운 여행이었길 바라요 🗽`;
    } else {
      greetingTitle = `${esc(state.name)}님, 오늘도 좋은 뉴욕 여행 되세요 🗽`;
    }

    return `
      <div class="home-greet">
        <div class="home-greet-eyebrow">${esc(dateLabel)}</div>
        <div class="home-greet-title">${greetingTitle}</div>
      </div>

      ${ddayBlock}

      <div class="home-card">
        <div class="home-card-title" id="weather-title">🌤 현재 날씨</div>
        <div id="weather-body">위치 확인 중…</div>
      </div>

      <div class="home-card">
        <div class="home-card-title">📍 오늘의 일정</div>
        ${todayDay
          ? (todayItems.length
              ? todayItems.map(it => `
                  <div class="home-mini-row">

  function renderSettle(d){
    const segTop = `
      <div class="segmented">
        <div class="segment-btn ${state.settleView==='group'?'active':''}" data-settle-view="group">🧾 정산</div>
        <div class="segment-btn ${state.settleView==='personal'?'active':''}" data-settle-view="personal">🛍 개인경비</div>
      </div>
    `;
    if(state.settleView === 'personal') return segTop + renderPersonalExpenses(d);

    const participants = d.participants;
    if(!participants.length) return segTop + `<div class="empty">멤버가 없어요.</div>`;

    const balance = {};
    participants.forEach(p => balance[p] = 0);
    d.expenses.forEach(ex => {
      const share = ex.amount / (ex.participants.length || 1);
      balance[ex.payer] = (balance[ex.payer]||0) + ex.amount;
      ex.participants.forEach(p => { balance[p] = (balance[p]||0) - share; });
    });

    const balanceRows = participants.map(p => {
      const v = Math.round(balance[p]||0);
      const cls = v>0 ? 'balance-plus' : v<0 ? 'balance-minus' : 'balance-zero';
      const sign = v>0 ? '+' : '';
      return `<div class="balance-row"><span>${esc(p)}</span><span class="${cls}">${sign}${v.toLocaleString()}원</span></div>`;
    }).join('');

    // settle transactions (greedy)
    let debtors = participants.map(p=>({p, v: Math.round(balance[p]||0)})).filter(x=>x.v<0).map(x=>({p:x.p, v:-x.v}));
    let creditors = participants.map(p=>({p, v: Math.round(balance[p]||0)})).filter(x=>x.v>0);
    debtors.sort((a,b)=>b.v-a.v); creditors.sort((a,b)=>b.v-a.v);
    const txns = [];
    let i=0, j=0;
    while(i<debtors.length && j<creditors.length){
      const amt = Math.min(debtors[i].v, creditors[j].v);
      if(amt>0) txns.push({from:debtors[i].p, to:creditors[j].p, amt});
      debtors[i].v -= amt; creditors[j].v -= amt;
      if(debtors[i].v<=0) i++;
      if(creditors[j].v<=0) j++;
    }

    const expenseGroups = groupByDate(d.expenses);
    const expenseCards = d.expenses.length ? expenseGroups.map(g => {
      const daySum = g.items.reduce((s,x)=>s+Number(x.amount||0), 0);
      return `
        <div class="day-expense-group">
          <div class="day-expense-head">
            <span>${esc(formatDateLabel(g.date))}</span>
            <span class="day-expense-total">${daySum.toLocaleString()}원</span>
          </div>
          ${g.items.slice().reverse().map(ex => `
            <div class="expense-card">
              <div class="expense-top">
                <div>
                  <div class="expense-desc">${esc(ex.desc)}</div>
                  <div class="expense-meta">${esc(ex.payer)} 결제</div>
                  <div class="expense-split">${ex.participants.map(esc).join(', ')} 나눠냄</div>
                </div>
                <div style="text-align:right">
                  <div class="expense-amt">${Number(ex.amount).toLocaleString()}원</div>
                  <button class="expense-del" data-del-exp="${ex.id}">삭제</button>
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }).join('') : `<div class="empty">아직 지출 내역이 없어요.</div>`;

    return segTop + `
      <div class="balance-panel">
        <div class="balance-title">잔액 (+받을돈 / -낼돈)</div>
        ${balanceRows}
      </div>
      ${txns.length ? `
        <div class="settle-title">정산 방법</div>
        ${txns.map(t => `
          <div class="settle-row">
            <span>${esc(t.from)}</span>
            <span class="settle-arrow">→</span>
            <span>${esc(t.to)}</span>
            <span class="settle-amt">${t.amt.toLocaleString()}원</span>
          </div>
        `).join('')}
      ` : ''}
      <div class="settle-title">지출 내역</div>
      ${expenseCards}
    `;
  }

  function formatDateLabel(d){
    if(/^\d{4}-\d{2}-\d{2}$/.test(d||'')){
      const dt = new Date(d + 'T00:00:00');
      if(!isNaN(dt.getTime())) return dt.toLocaleDateString('ko-KR', { month:'long', day:'numeric', weekday:'short' });
    }
    return d || '날짜 미상';
  }

  function groupByDate(list){
    const groups = {};
    list.forEach(x=>{
      const key = x.date || '날짜 미상';
      if(!groups[key]) groups[key] = [];
      groups[key].push(x);
    });
    const keys = Object.keys(groups);
    const isoKeys = keys.filter(k=>/^\d{4}-\d{2}-\d{2}$/.test(k)).sort((a,b)=> b.localeCompare(a));
    const otherKeys = keys.filter(k=>!/^\d{4}-\d{2}-\d{2}$/.test(k));
    return [...isoKeys, ...otherKeys].map(k => ({ date: k, items: groups[k] }));
  }

  function todayISO(){
    const now = new Date();
    return now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
  }

  function computeDday(d){
    const datedDays = (d.days||[])
      .filter(x => /^\d{4}-\d{2}-\d{2}$/.test(x.date||''))
      .map(x => x.date)
      .sort();
    if(!datedDays.length) return { status:'unset' };

    const msPerDay = 86400000;
    const start = datedDays[0];
    const end = datedDays[datedDays.length - 1];
    const startDate = new Date(start + 'T00:00:00');
    const endDate = new Date(end + 'T00:00:00');
    const todayDate = new Date(todayISO() + 'T00:00:00');

    if(todayDate < startDate){
      const diff = Math.round((startDate - todayDate) / msPerDay);
      return { status:'before', diff, startLabel: formatDateLabel(start) };
    } else if(todayDate > endDate){
      const diff = Math.round((todayDate - endDate) / msPerDay);
      return { status:'after', diff };
    } else {
      const dayNum = Math.round((todayDate - startDate) / msPerDay) + 1;
      const totalDays = Math.round((endDate - startDate) / msPerDay) + 1;
      return { status:'during', dayNum, totalDays };
    }
  }

  function fmtDT(v, withTime){
    if(!v) return '-';
    try{
      const d = new Date(v);
      if(isNaN(d.getTime())) return esc(v);
      const opts = withTime ? {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'} : {month:'numeric', day:'numeric'};
      return d.toLocaleString('ko-KR', opts);
    }catch(e){ return esc(v); }
  }

  function attachDynamicHandlers(){
    document.querySelectorAll('[data-add-item]').forEach(el=>{
      el.onclick = ()=> openItemModal(el.dataset.addItem);
    });
    const addDayBtn = document.getElementById('add-day-btn');
    if(addDayBtn) addDayBtn.onclick = addDay;
    document.querySelectorAll('[data-del-item]').forEach(el=>{
      el.onclick = ()=>{
        const [dayId, itemId] = el.dataset.delItem.split('|');
        const day = state.data.days.find(x=>x.id===dayId);
        day.items = day.items.filter(x=>x.id!==itemId);
        persistAndRender();
      };
    });
    document.querySelectorAll('[data-move-item]').forEach(el=>{
      el.onclick = ()=>{
        const [dayId, itemId, dir] = el.dataset.moveItem.split('|');
        const day = state.data.days.find(x=>x.id===dayId);
        if(!day) return;
        const idx = day.items.findIndex(x=>x.id===itemId);
        if(idx<0) return;
        const swapWith = dir==='up' ? idx-1 : idx+1;
        if(swapWith<0 || swapWith>=day.items.length) return;
        [day.items[idx], day.items[swapWith]] = [day.items[swapWith], day.items[idx]];
        persistAndRender();
      };
    });
    document.querySelectorAll('[data-del-exp]').forEach(el=>{
      el.onclick = ()=>{
        state.data.expenses = state.data.expenses.filter(x=>x.id!==el.dataset.delExp);
        persistAndRender();
      };
    });
    document.querySelectorAll('[data-del-resv]').forEach(el=>{
      el.onclick = ()=>{
        state.data.reservations = state.data.reservations.filter(x=>x.id!==el.dataset.delResv);
        persistAndRender();
      };
    });
    document.querySelectorAll('[data-map]').forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        const q = el.dataset.map.trim();
        if(!q) return;
        const url = 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
        window.open(url, '_blank');
      };
    });
    document.querySelectorAll('[data-toggle-check]').forEach(el=>{
      el.onclick = ()=>{
        const list = state.data.checklist[state.checklistView];
        const item = list.find(x=>x.id===el.dataset.toggleCheck);
        if(item){
          if(!item.checkedBy) item.checkedBy = [];
          const idx = item.checkedBy.indexOf(state.name);
          if(idx>=0) item.checkedBy.splice(idx,1);
          else item.checkedBy.push(state.name);
        }
        persistAndRender();
      };
    });
    document.querySelectorAll('[data-del-check]').forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        state.data.checklist[state.checklistView] = state.data.checklist[state.checklistView].filter(x=>x.id!==el.dataset.delCheck);
        persistAndRender();
      };
    });
    document.querySelectorAll('[data-checklist-view]').forEach(el=>{
      el.onclick = ()=>{
        state.checklistView = el.dataset.checklistView;
        render();
      };
    });
    document.querySelectorAll('[data-settle-view]').forEach(el=>{
      el.onclick = ()=>{
        state.settleView = el.dataset.settleView;
        render();
      };
    });
    document.querySelectorAll('[data-del-personal]').forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        const mine = state.data.personalExpenses[state.name] || [];
        state.data.personalExpenses[state.name] = mine.filter(x=>x.id!==el.dataset.delPersonal);
        persistAndRender();
      };

    document.querySelectorAll('[data-del-memo]').forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        state.data.memos = state.data.memos.filter(x=>x.id!==el.dataset.delMemo);
        persistAndRender();
      };

    document.querySelectorAll('[data-set-date]').forEach(el=>{
      el.onclick = ()=>{
        const day = state.data.days.find(x=>x.id===el.dataset.setDate);
        if(!day) return;

        if(!day) return;
        state.modal = { type:'confirm-day', dayId: day.id, label: day.label, itemCount: day.items.length };
        render();
      };
    });
  }

  }
  function openChecklistModal(){
    state.modal = { type:'checklist', view: state.checklistView };
    render();
  }
  function openPersonalExpenseModal(){
    state.modal = { type:'personal-expense', date: todayISO() };
    render();
  }
  function openMemoModal(){
    state.modal = { type:'memo', private: false };
    render();
  }
  function closeModal(){ state.modal = null; render(); }

  function renderModal(){
    const m = state.modal;
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.id = 'modal-bg';

    if(m.type === 'item'){
      bg.innerHTML = `
        <div class="modal">
          <div class="modal-title">일정 추가</div>
          <div class="field"><label>시간 (선택사항)</label><input id="m-time" type="time" /></div>
          <div class="field"><label>장소 / 활동</label><input id="m-place" type="text" placeholder="예: 협재해수욕장" /></div>
          <div class="field"><label>메모</label><input id="m-memo" type="text" placeholder="예: 튜브 대여, 3시 도착" /></div>
          <div class="modal-actions">
            <button class="btn-cancel" id="m-cancel">취소</button>
            <button class="btn-confirm" id="m-save">추가하기</button>
          </div>
        </div>
      `;
    } else if(m.type === 'set-date'){
      bg.innerHTML = `
        <div class="modal">
          <div class="modal-title">날짜 설정</div>
          <div class="field"><label>날짜 (YYYY-MM-DD)</label><input id="m-date-value" type="date" value="${esc(m.value)}" /></div>
          <div class="modal-actions">
            <button class="btn-cancel" id="m-cancel">취소</button>
            <button class="btn-confirm" id="m-save">저장</button>
          </div>
        </div>
      `;
    } else if(m.type === 'confirm-day'){
      bg.innerHTML = `
        <div class="modal">
          <div class="modal-title">${esc(m.label)} 삭제</div>
          <p style="font-size:13.5px; color:#11111190; line-height:1.6; margin:-6px 0 18px;">
            ${m.itemCount > 0 ? `이 날짜에 등록된 일정 <b>${m.itemCount}개</b>가 모두 삭제돼요.<br/>계속할까요?` : `이 날짜를 삭제할까요?`}
          </p>
          <div class="modal-actions">
            <button class="btn-cancel" id="m-cancel">취소</button>
            <button class="btn-confirm" id="m-save" style="background:var(--red);">삭제하기</button>
          </div>
        </div>
      `;
    } else if(m.type === 'checklist'){
      bg.innerHTML = `
        <div class="modal">
          <div class="modal-title">${m.view==='return' ? '귀국 짐 준비물 추가' : '여행 준비물 추가'}</div>
          <div class="field"><label>항목</label><input id="m-check-text" type="text" placeholder="예: 선글라스" /></div>
          <div class="modal-actions">
            <button class="btn-cancel" id="m-cancel">취소</button>
            <button class="btn-confirm" id="m-save">추가하기</button>
          </div>
        </div>
      `;
    } else if(m.type === 'memo'){
      bg.innerHTML = `
        <div class="modal">
          <div class="modal-title">메모 추가</div>
          <div class="type-toggle">
            <div class="type-btn ${!m.private?'on':''}" data-privacy="shared">🌐 전체 공개</div>
            <div class="type-btn ${m.private?'on':''}" data-privacy="private">🔒 나만 보기</div>
          </div>
          <div class="field"><label>내용</label><textarea id="m-memo-text" rows="4" style="width:100%; border:2px solid var(--border); border-radius:10px; padding:10px 12px; font-family:var(--sans); font-size:14px; box-sizing:border-box; resize:vertical;" placeholder="친구들과 공유할 메모를 남겨보세요"></textarea></div>
          <div class="modal-actions">
            <button class="btn-cancel" id="m-cancel">취소</button>
            <button class="btn-confirm" id="m-save">추가하기</button>
          </div>
        </div>
      `;
    } else if(m.type === 'personal-expense'){
      bg.innerHTML = `
        <div class="modal">
          <div class="modal-title">개인 경비 추가</div>
          <div class="field"><label>항목</label><input id="m-pdesc" type="text" placeholder="예: 자유의 여신상 기념품" /></div>
          <div class="field"><label>금액 (원)</label><input id="m-pamount" type="number" placeholder="예: 25000" /></div>
          <div class="field"><label>날짜</label><input id="m-pdate" type="date" value="${esc(m.date)}" /></div>
          <div class="modal-actions">
            <button class="btn-cancel" id="m-cancel">취소</button>
            <button class="btn-confirm" id="m-save">추가하기</button>
          </div>
        </div>
      `;
    } else if(m.type === 'expense'){
      bg.innerHTML = `
        <div class="modal">
          <div class="modal-title">지출 추가</div>
          <div class="field"><label>항목</label><input id="m-desc" type="text" placeholder="예: 렌터카, 저녁식사" /></div>
          <div class="field"><label>금액 (원)</label><input id="m-amount" type="number" placeholder="예: 60000" /></div>
          <div class="field"><label>날짜</label><input id="m-exp-date" type="date" value="${esc(m.date)}" /></div>
          <div class="field">
            <label>결제한 사람</label>
            <select id="m-payer">
              ${state.data.participants.map(p=>`<option value="${esc(p)}" ${p===m.payer?'selected':''}>${esc(p)}</option>`).join('')}
            </select>
          </div>
          <div class="field">
            <label>나눠 낼 사람</label>
            <div class="check-list" id="m-participants">
              ${state.data.participants.map(p=>`<div class="check-chip ${m.participants.includes(p)?'on':''}" data-p="${esc(p)}">${esc(p)}</div>`).join('')}
            </div>
          </div>
          <div class="modal-actions">
            <button class="btn-cancel" id="m-cancel">취소</button>
            <button class="btn-confirm" id="m-save">추가하기</button>
          </div>
        </div>
      `;
    } else if(m.type === 'reservation'){
      const isFlight = m.kind === 'flight';
      bg.innerHTML = `
        <div class="modal">
          <div class="modal-title">예약 추가</div>
          <div class="type-toggle">
            <div class="type-btn ${isFlight?'on':''}" data-kind="flight">✈ 항공권</div>
            <div class="type-btn ${!isFlight?'on':''}" data-kind="lodging">🏠 숙소</div>
          </div>
          <div class="field">
            <label>${isFlight ? '구간 (예: 인천 → 오사카)' : '숙소명'}</label>
            <input id="m-title" type="text" placeholder="${isFlight ? '인천 → 오사카' : '예: 신라스테이 제주'}" />
          </div>
          <div class="field">
            <label>${isFlight ? '항공사 / 편명' : '주소 (선택)'}</label>
            <input id="m-provider" type="text" placeholder="${isFlight ? '예: 대한항공 KE123' : '예: 제주시 ...'}" />
          </div>
          <div class="field">
            <label>${isFlight ? '출발 일시' : '체크인 날짜'}</label>
            <input id="m-start" type="${isFlight?'datetime-local':'date'}" />
          </div>
          <div class="field">
            <label>${isFlight ? '도착 일시' : '체크아웃 날짜'}</label>
            <input id="m-end" type="${isFlight?'datetime-local':'date'}" />
          </div>
          <div class="field">
            <label>예약번호 (선택)</label>
            <input id="m-confirm" type="text" placeholder="예: ABC123" />
          </div>
          <div class="field">
            <label>메모 (선택)</label>
            <input id="m-memo2" type="text" placeholder="예: 좌석 창가, 조식 포함" />
          </div>
          <div class="modal-actions">
            <button class="btn-cancel" id="m-cancel">취소</button>
            <button class="btn-confirm" id="m-save">추가하기</button>
          </div>
        </div>
      `;
    }

    document.body.appendChild(bg);
    document.getElementById('m-cancel').onclick = ()=>{ bg.remove(); closeModal(); };
    bg.onclick = (e)=>{ if(e.target===bg){ bg.remove(); closeModal(); } };

    if(m.type === 'item'){
      document.getElementById('m-save').onclick = ()=>{
        const place = document.getElementById('m-place').value.trim();
        if(!place) return;
        const day = state.data.days.find(x=>x.id===m.dayId);
        day.items.push({
          id: uid(),
          time: document.getElementById('m-time').value,
          place,
          memo: document.getElementById('m-memo').value.trim(),
          by: state.name
        });
        bg.remove();
        state.modal = null;
        persistAndRender();
      };
    } else if(m.type === 'set-date'){
      document.getElementById('m-save').onclick = ()=>{
        const val = document.getElementById('m-date-value').value;
        const day = state.data.days.find(x=>x.id===m.dayId);
        if(day) day.date = val;
        bg.remove();
        state.modal = null;
        persistAndRender();
      };
    } else if(m.type === 'confirm-day'){
      document.getElementById('m-save').onclick = ()=>{
        state.data.days = state.data.days.filter(x=>x.id!==m.dayId);
        bg.remove();
        state.modal = null;
        persistAndRender();
      };
    } else if(m.type === 'checklist'){
      document.getElementById('m-save').onclick = ()=>{
        const text = document.getElementById('m-check-text').value.trim();
        if(!text) return;
        state.data.checklist[m.view].push({ id: uid(), text, checkedBy: [] });
        bg.remove();
        state.modal = null;
        persistAndRender();
      };
    } else if(m.type === 'memo'){
      document.querySelectorAll('[data-privacy]').forEach(btn=>{
        btn.onclick = ()=>{
          m.text = document.getElementById('m-memo-text').value;
          m.private = btn.dataset.privacy === 'private';
          bg.remove();
          renderModal();
        };
      });
      const textEl = document.getElementById('m-memo-text');
      if(m.text) textEl.value = m.text;
      document.getElementById('m-save').onclick = ()=>{
        const text = document.getElementById('m-memo-text').value.trim();
        if(!text) return;
        state.data.memos.push({
          id: uid(), text, by: state.name, private: !!m.private,
          date: new Date().toLocaleDateString('ko-KR', {month:'numeric', day:'numeric'})
        });
        bg.remove();
        state.modal = null;
        persistAndRender();
      };
    } else if(m.type === 'personal-expense'){
      document.getElementById('m-save').onclick = ()=>{
        const desc = document.getElementById('m-pdesc').value.trim();
        const amount = parseFloat(document.getElementById('m-pamount').value);
        const date = document.getElementById('m-pdate').value || todayISO();
        if(!desc || !amount) return;
        if(!state.data.personalExpenses[state.name]) state.data.personalExpenses[state.name] = [];
        state.data.personalExpenses[state.name].push({ id: uid(), desc, amount, date });
        bg.remove();
        state.modal = null;
        persistAndRender();
      };
    } else if(m.type === 'reservation'){
      document.querySelectorAll('.type-btn').forEach(btn=>{
        btn.onclick = ()=>{
          m.kind = btn.dataset.kind;
          bg.remove();
          renderModal();
        };
      });
      document.getElementById('m-save').onclick = ()=>{
        const title = document.getElementById('m-title').value.trim();
        if(!title) return;
        state.data.reservations.push({
          id: uid(),
          type: m.kind,
          title,
          provider: document.getElementById('m-provider').value.trim(),
          start: document.getElementById('m-start').value,
          end: document.getElementById('m-end').value,
          confirmNo: document.getElementById('m-confirm').value.trim(),
          memo: document.getElementById('m-memo2').value.trim(),
          by: state.name
        });
        bg.remove();
        state.modal = null;
        persistAndRender();
      };
    } else if(m.type === 'expense'){
      document.querySelectorAll('#m-participants .check-chip').forEach(chip=>{
        chip.onclick = ()=>{
          const p = chip.dataset.p;
          const idx = m.participants.indexOf(p);
          if(idx>=0) m.participants.splice(idx,1); else m.participants.push(p);
          chip.classList.toggle('on');
        };
      });
      document.getElementById('m-save').onclick = ()=>{
        const desc = document.getElementById('m-desc').value.trim();
        const amount = parseFloat(document.getElementById('m-amount').value);
        const payer = document.getElementById('m-payer').value;
        const date = document.getElementById('m-exp-date').value || todayISO();
        if(!desc || !amount || !m.participants.length) return;
        state.data.expenses.push({
          id: uid(), desc, amount, payer,
          participants: m.participants.slice(),
          date
        });
        bg.remove();
        state.modal = null;
        persistAndRender();
      };
    }
  }

  async function init(){
    app.innerHTML = `<div class="entry-wrap"><div class="empty">🚕 불러오는 중…</div></div>`;
    const last = loadLastSession();
    if(last && last.code && last.name){
      state.code = last.code;
      state.name = last.name;
      const data = await loadTrip(last.code);
      if(data){
        state.data = data;
        if(!data.participants.includes(last.name)) data.participants.push(last.name);
        startPolling();
        showSplashThenMain();
        saveTrip(last.code, data);
        return;
      }
    }
    render();
  }

  function waitForFirebase(){
    return new Promise(resolve=>{
      if(window.__fbReady || window.__fbConfigMissing) return resolve();
      window.addEventListener('firebase-ready', ()=>resolve(), { once:true });
    });
  }

  (async ()=>{
    await waitForFirebase();
    if(window.__fbConfigMissing){
      app.innerHTML = `
        <div class="entry-wrap">
          <div class="entry-ticket">
            <div class="brand-eyebrow">⚠️ 설정 필요</div>
            <h1 class="brand-title">Firebase<br/>설정이 비어있어요</h1>
            <p class="brand-sub" style="font-family:var(--sans); opacity:0.75;">
              HTML 파일 상단의 &lt;script type="module"&gt; 안에 있는<br/>
              <b>firebaseConfig</b> 값을 본인의 Firebase 프로젝트 정보로 바꿔주세요.<br/><br/>
              1) console.firebase.google.com에서 프로젝트 생성<br/>
              2) Firestore Database 활성화<br/>
              3) 웹 앱 추가 후 나오는 설정값 붙여넣기
            </p>
          </div>
        </div>
      `;
      return;
    }
    init();
  })();
})();
</script>
</body>
</html>
